# Yarn 4, with a real `node_modules` tree instead of Yarn's PnP loader.
#
# NOTE the spelling: the accepted value is `node-modules` (hyphen). Writing
# `node_modules` here is silently invalid — Yarn then reports
# "@types/node@npm:... isn't supported by any available linker" (YN0012) and installs
# nothing, and the error names a random package rather than the config key, so it is
# worth knowing about. `node-modules` is deliberate: the broker, the helper and the
# tests are launched by `node`, `git` and system services that know nothing about PnP,
# and a push must not depend on a Yarn shim being on PATH.
nodeLinker: node-modules

# The install runs unattended in CI-like environments; nothing here needs telemetry.
enableTelemetry: false

# Faster unpacking; this project ships no large dependency trees.
compressionLevel: 0

plugins:
  - checksum: 37b2361b1502b2054e6779788c0e9bdd6a90ce49852a8cad2feda79b0614ec94f06fb6e78951f5f95429c610d7934dd077caa47413a0227378a102c55161616d
    path: .yarn/plugins/plugin-prepare-lifecycle.cjs
    spec: 'https://github.com/un-es/yarn-plugin-prepare-lifecycle/releases/download/v0.0.1/index.js'
