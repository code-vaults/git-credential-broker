# Snippets to adapt, not to paste wholesale. See the README for the reasoning.
#
# `git-credential-broker compose` prints the sidecar in 1b, already filled in for your paths:
#
#   git-credential-broker compose --socket-dir <a host directory the DSH container mounts> \
#     > docker-compose.broker.yml
#
# Generate it rather than retyping it. The mount targets inside the container must match the
# paths `init --mode sidecar` recorded, and both commands read them from one definition, so a
# hand-edited copy is the one thing that can silently drift.

## 1. Host side: run the broker outside the container

The broker reads the private key and holds the only long-lived secret, so it must run where the
container cannot reach the key. Either a host process or a sidecar container works.

Relative paths below are relative to this file, which is what `compose` does with them: the only
absolute one is the socket directory, because it lives outside the deployment directory on purpose.

### a. Host process under systemd (or a DSM scheduled task)

This path needs Node on the host: `npm install -g git-credential-broker` first.

```ini
# /etc/systemd/system/git-cred-broker.service
[Unit]
Description=git credential broker
After=network-online.target

[Service]
Type=simple
# The socket directory must be reachable by the container's uid.
RuntimeDirectory=git-cred-broker
RuntimeDirectoryMode=0750
ExecStartPre=/usr/bin/git-credential-brokerd --config /volume1/docker/git-cred-broker/broker.config.json --check
ExecStart=/usr/bin/git-credential-brokerd --config /volume1/docker/git-cred-broker/broker.config.json
Restart=on-failure
# The key is 0600 root; nothing else needs read access to it.
User=root

[Install]
WantedBy=multi-user.target
```

### b. Sidecar container: Docker, but no Node on the host

The usual NAS case. The image installs the package at start, so there is no checkout to copy and
nothing to build. Only this container mounts the private key; the socket directory is the *only*
thing shared with the DSH container.

```yaml
services:
  git-cred-broker:
    image: node:24-slim
    container_name: git-cred-broker
    restart: unless-stopped
    # Must match the uid/gid of the container that will use the socket, or it is unusable.
    user: "1026:100"
    read_only: true
    tmpfs:
      # npx needs somewhere writable for its cache; /tmp is a tmpfs above.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - npm_config_cache=/tmp/npm-cache
    command:
      - sh
      - -c
      - exec npx --yes --package 'git-credential-broker' git-credential-brokerd --config /etc/git-cred-broker/broker.config.json
    volumes:
      # The configuration and the key: read-only, mounted here and nowhere else.
      - ./broker.config.json:/etc/git-cred-broker/broker.config.json:ro
      - ./app.pem:/etc/git-cred-broker/app.pem:ro
      # Writable, and the only secret that is: GitHub rotates the refresh token on every exchange,
      # so the broker has to write the new one back. It sits beside the key on the host and is
      # created by `git-credential-broker authorize` — see the README.
      - ./user.refresh:/etc/git-cred-broker/user.refresh:rw
      # Writable: the audit log is appended to, and it must stay outside the DSH container.
      - ./log:/var/log/git-cred-broker
      # The socket directory, shared with the DSH container below. This is the only interface
      # between the two: no ports are published, and none should be added.
      - /volume1/homes/<you>/Workspaces/<project>/.dsh/git-broker:/run/git-broker
```

Pin a version (`npx --yes --package 'git-credential-broker@0.1.0'`) if you would rather not
resolve `latest` on every start; `compose` pins the version it was generated from.

## 2. DSH container: reach the socket and configure git

Add the socket mount and the two environment variables. Setting them in `environment:` is
better than sourcing a file, because it reaches every process including non-login shells.

```yaml
services:
  dsh:
    # ... existing configuration ...
    environment:
      # ... existing PUID/PGID/proxy entries ...
      - GIT_BROKER_SOCKET=/run/git-cred-broker/broker.sock
      # Fail closed: never silently fall back to another credential source.
      - GIT_BROKER_REQUIRE=1
    volumes:
      # ... existing mounts ...
      - git-cred-broker-run:/run/git-cred-broker

volumes:
  git-cred-broker-run:
```

Then, inside the container:

```sh
git-credential-broker setup
```

Do **not** put the private key or any credential in `~/Workspaces`, `~/.dsh` or `~/.dotfiles`:
all three are mounted into the container. `~/.dsh` in particular is *inside* the
`~/Workspaces` mount, so it is not a safe place for anything secret.
